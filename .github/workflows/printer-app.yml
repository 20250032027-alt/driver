# Builds the Scan POS Printer Android app on GitHub (free), and publishes it as a download:
#   https://github.com/<you>/<repo>/releases/download/printer-app/scanpos-printer.apk
name: Build Scan POS Printer (Android)

on:
  push:
    paths: ['printer-app/**', '.github/workflows/printer-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Signing with your own key (GitHub secret)."
          else
            unset KEYSTORE_PASSWORD
            echo "Signing with the key in printer-app/app/signing/."
          fi
          gradle -p printer-app assembleRelease --no-daemon --stacktrace
          cp printer-app/app/build/outputs/apk/release/app-release.apk scanpos-printer.apk
          ls -la scanpos-printer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: scanpos-printer
          path: scanpos-printer.apk

      - name: Publish as a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete printer-app --yes --cleanup-tag || true
          gh release create printer-app scanpos-printer.apk \
            --title "Scan POS Printer (Android) build ${{ github.run_number }}" \
            --notes "Install on the Android phone at the counter. Open this page on the phone, tap scanpos-printer.apk, allow installing, then open Scan POS Printer and follow the 3 steps." \
            --latest
